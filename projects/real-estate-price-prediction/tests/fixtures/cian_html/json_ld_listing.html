<!DOCTYPE html>
<html lang="ru">
<head>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {
      "@type": "Offer",
      "url": "https://example.com/sale/flat/900010/",
      "name": "2-комн. квартира",
      "offers": {"price": "8500000"},
      "address": {"streetAddress": "ул. Школьная, д. 5"}
    }
  ]
}
</script>
</head>
<body>
<p>Результаты поиска отображаются через JSON-LD (тестовые данные).</p>
</body>
</html>
