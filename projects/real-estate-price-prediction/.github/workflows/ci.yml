name: CI

# Python 3.11 to match the Dockerfile. The notebook and Docker build are not
# run in CI to keep it short.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/real-estate-price-prediction

jobs:
  test:
    name: Lint + Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            projects/real-estate-price-prediction/requirements.txt
            projects/real-estate-price-prediction/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check for dependency conflicts (pip check)
        run: pip check

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Compile / import smoke check (compileall)
        run: python -m compileall -q src api dashboard scripts tests

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=src --cov=api --cov-report=term-missing
