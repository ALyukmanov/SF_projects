# Параметры проекта: пути, веса событий, границы временного split.
# Все пути относительны корню проекта (retail-recommender-system/).

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports

raw_files:
  events: events.csv
  category_tree: category_tree.csv
  item_properties:
    - item_properties_part1.csv
    - item_properties_part2.csv

# Веса событий для implicit-feedback. Начальные значения, не объявляются оптимальными.
event_weights:
  view: 1
  addtocart: 3
  transaction: 5

# Сильные события (основная бизнес-цель) и события-покупки.
strong_events: [addtocart, transaction]
transaction_events: [transaction]

# Аномально активные визиторы: строго больше порога событий за весь период.
bot_event_threshold: 500

# Границы временного split (включительно по датам, UTC).
# Заморожены после анализа активности во времени (см. notebooks/01_eda.ipynb).
split:
  train_start: "2015-05-03"
  train_end: "2015-08-21"
  val_start: "2015-08-22"
  val_end: "2015-09-04"
  test_start: "2015-09-05"
  test_end: "2015-09-18"

# Первый недельный срез item_properties. До этой даты content-признаки = UNKNOWN.
properties_first_snapshot: "2015-05-10"

# Построение признаков (неделя 2).
# cutoff — момент, в который модель делает предсказание. Все признаки считаются
# только из событий с ts < cutoff; целевое окно — [cutoff, label_window_end].
feature_engineering:
  cutoff: "2015-07-01"
  label_window_end: "2015-09-18"

# Оценка моделей (неделя 3).
evaluation:
  k_values: [10, 20]
  primary_k: 10
  # already-seen policy: основная оценка исключает train-items пользователя.
  filter_seen: true
  history_segments: [[1, 1], [2, 4], [5, null]]

cooccurrence:
  # co-occurrence считается только по пользователям с числом уникальных train-товаров в этом диапазоне
  min_user_items: 2
  max_user_items: 200
  top_neighbours: 100
  # сколько последних/сильных товаров истории пользователя брать как "запрос"
  user_query_items: 20

random_seed: 42
