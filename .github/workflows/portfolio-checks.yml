name: Проверки портфолио

# Только проверки на чтение — ничего не публикует, не деплоит, не создаёт
# релизы. Запускается на push и pull request.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-syntax:
    name: Синтаксис Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверка синтаксиса всех .py файлов (компиляция без импорта)
        run: |
          set -e
          find projects -name "*.py" -not -path "*/.venv*/*" -not -path "*/venv/*" -print0 \
            | xargs -0 -r python -m py_compile
          echo "Все .py файлы скомпилированы без ошибок."

  notebooks:
    name: Корректность notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка nbformat
        run: pip install nbformat

      - name: Проверка структуры каждого notebook
        run: |
          set -e
          python - <<'PY'
          import pathlib, sys
          import nbformat

          failures = []
          for path in pathlib.Path("projects").rglob("*.ipynb"):
              if "checkpoint" in str(path).lower():
                  continue
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
              except Exception as e:
                  failures.append((str(path), str(e)))

          for path, err in failures:
              print(f"НЕВАЛИДЕН: {path}: {err}")

          if failures:
              sys.exit(1)
          print("Все notebooks валидны.")
          PY

  real-estate-tests:
    name: Тесты real-estate-price-prediction
    runs-on: ubuntu-latest
    continue-on-error: true  # тяжёлые ML-зависимости (xgboost/catboost/selenium) не всегда
                              # ставятся чисто в CI; job показывает статус, но не блокирует
                              # остальные проверки.
    defaults:
      run:
        working-directory: projects/real-estate-price-prediction
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Запуск тестов (tests/integration/ требует сеть и исключён pyproject.toml)
        run: pytest tests/ -v

  # Что этот workflow намеренно НЕ делает:
  # - не запускает скрейпинг живых сайтов;
  # - не запускает Telegram-бота (нет токена в CI);
  # - не запускает tests/integration/ (нужна сеть);
  # - не публикует релизы, не меняет видимость репозитория, никуда не деплоит;
  # - notebook hh-vacancy-employer-sql требует живое подключение к PostgreSQL
  #   и нигде в этом pipeline не выполняется.
